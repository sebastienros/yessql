name: Publish

on:
  push:
    tags: 
      - v*

jobs:

  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
    - uses: actions/checkout@v6

    # Required if the .NET version is not available on the GH Actions images
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x
          11.0.x

    - name: Get the version
      id: get_version
      run: |
        # Strip leading 'v' if present
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      shell: bash

    - name: Build
      run: dotnet build --configuration Release -p:Version=${{ steps.get_version.outputs.VERSION }}

    - name: Pack
      run: dotnet pack --output artifacts --configuration Release --no-restore --no-build -p:Version=${{ steps.get_version.outputs.VERSION }}

    # Kept next to the push as the API key it returns is short-lived
    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: sebastienros

    - name: Publish on NuGet
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
