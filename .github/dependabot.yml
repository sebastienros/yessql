# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Ignore Abstractions packages - these should not be updated
    ignore:
      - dependency-name: "*Abstractions"
      # Pinned per TFM in src/Versions.props, on the major version Microsoft.Data.SqlClient
      # uses for that TFM. Dependabot can't tell the TFMs apart, so bump these by hand.
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: ["version-update:semver-major"]
    groups:
       # Grouped version updates configuration
       all-dependencies:
          patterns:
            - "*"
